# Voyage Analytics — continuous integration
#
# Runs on every push and pull request to main. Three independent jobs so a
# failure points at one thing:
#
#   lint     style and syntax, seconds
#   test     the pipeline modules import, the API contract holds
#   docker   the serving image actually builds
#
# The test job deliberately trains on a *sample* rather than the full 271k rows:
# CI should verify the pipeline is wired correctly, not spend 20 minutes
# reproducing a model whose metrics are already recorded in reports/.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # allow manual runs from the Actions tab

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Check syntax and common errors
        # E9/F63/F7/F82 are the "this will crash at runtime" rules.
        run: ruff check src/ tests/ main.py --select E9,F63,F7,F82 --output-format github

      - name: Style report (non-blocking)
        run: ruff check src/ tests/ main.py --exit-zero --statistics

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # The serving subset plus pytest — the full requirements file pulls in
        # jupyter and mlflow, which CI does not need.
        #
        # streamlit is added because tests/test_theme.py imports the dashboard
        # design system, and theme.py imports streamlit at module level. Without
        # it that test errors on import rather than skipping, which is what broke
        # the first CI run.
        run: |
          pip install -r docker/requirements-serve.txt
          pip install pytest==8.3.3 streamlit==1.38.0

      - name: Verify every module imports
        # Catches broken imports before the slower steps run.
        run: |
          python -c "
          import importlib
          for m in ['src.utils', 'src.validation', 'src.data_ingestion',
                    'src.features', 'src.models.flight_price', 'src.models.gender',
                    'src.models.recommender', 'src.serving']:
              importlib.import_module(m)
              print(f'  {m} OK')
          "

      - name: Data validation gate
        run: python -m src.validation --scope raw

      - name: Build data and features
        run: |
          python -m src.data_ingestion
          python -m src.features

      - name: Audit generated tables
        run: python -m src.validation --scope processed

      - name: Train on a sample
        # --quick keeps the run to a couple of minutes; the authoritative metrics
        # come from the full local run recorded in reports/.
        run: python main.py --stages train_price --quick

      - name: Run the test suite
        run: pytest tests/ -v --tb=short

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/*.json
          retention-days: 14

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: voyage-analytics-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        # The image ships without models/ in CI (they are gitignored), so /health
        # is expected to report "degraded". What is being tested here is that the
        # container starts, binds its port and serves HTTP at all — a build that
        # cannot boot should fail the pipeline.
        run: |
          docker run -d --name api -p 5000:5000 voyage-analytics-api:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null -w '%{http_code}' http://localhost:5000/ | grep -q 200; then
              echo "container is serving"; break
            fi
            sleep 2
          done
          echo "--- / ---";       curl -s http://localhost:5000/ | head -c 400
          echo; echo "--- /health ---"; curl -s http://localhost:5000/health | head -c 300
          docker rm -f api

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests against the Kubernetes schema
        uses: instrumenta/kubeval-action@master
        with:
          files: k8s/
        continue-on-error: true

      - name: Structural checks
        run: |
          python - <<'PY'
          import yaml
          d = next(iter(yaml.safe_load_all(open('k8s/deployment.yaml'))))
          c = d['spec']['template']['spec']['containers'][0]
          sp = c['startupProbe']
          allowance = sp['periodSeconds'] * sp['failureThreshold']
          # The API loads its models at startup (9-16s measured). If someone
          # tightens this probe the pods will restart-loop in production, so the
          # budget is asserted here rather than left to review.
          assert allowance >= 60, f"startupProbe allowance {allowance}s is too tight"
          assert c['securityContext']['readOnlyRootFilesystem'] is True
          assert d['spec']['template']['spec']['securityContext']['runAsNonRoot'] is True
          assert d['spec']['strategy']['rollingUpdate']['maxUnavailable'] == 0
          print(f"startupProbe allowance {allowance}s, hardening in place - OK")
          PY
